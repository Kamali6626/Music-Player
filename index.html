<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Player</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>🎵 Music Player</h1>
    <img id="cover" src="images/cover1.jpg" alt="Song Cover">
    <div class="song-info">
        <h2 id="title">No Song Selected</h2>
        <p id="artist"></p>
    </div>

    <audio id="audio"></audio>

    <input type="range" id="progress" value="0">

    <div class="controls">
        <button id="prev">⏮ Previous</button>
        <button id="play">▶ Play</button>
        <button id="next">Next ⏭</button>
    </div>

    <div class="volume">
        Volume
        <input type="range" id="volume" min="0" max="100" step="0.1" value="1">
    </div>

 <h3>Playlist</h3>   
    
    <table>
        <thead>
            <tr>
                <th>Title</th>
                <th>Artist</th>
                <th>Duration</th>
            </tr>
        </thead>

        <tbody id="playlist"></tbody>

    </table>

</div>

<script src="script.js"></script>

</body>
</html>
